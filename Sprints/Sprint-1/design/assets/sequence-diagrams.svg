<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320" role="img" aria-labelledby="title desc">
  <title id="title">CS160 Project sequence diagrams</title>
  <desc id="desc">Three sequence diagrams show appointment booking with confirmation, failure fallback, and a future appointment reminder.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.pageTitle{font-size:30px;font-weight:700}.panelTitle{font-size:23px;font-weight:700}.actor{font-size:15px;font-weight:700}.msg{font-size:14px}.note{font-size:13px;fill:#475569}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5}.call{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#64748b;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="1320" fill="#ffffff"/>
  <text x="45" y="48" class="pageTitle">Sequence Diagrams — Draft</text>

  <rect x="30" y="75" width="1340" height="525" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="112" class="panelTitle">1. Mock appointment request and explicit confirmation — Sprint 1 target</text>
  <g>
    <rect x="70" y="140" width="140" height="46" rx="7" fill="#e0f2fe" stroke="#0284c7"/><text x="140" y="168" class="actor" text-anchor="middle">User</text>
    <rect x="275" y="140" width="140" height="46" rx="7" fill="#ccfbf1" stroke="#0f766e"/><text x="345" y="168" class="actor" text-anchor="middle">React UI</text>
    <rect x="480" y="140" width="140" height="46" rx="7" fill="#ffedd5" stroke="#c2410c"/><text x="550" y="168" class="actor" text-anchor="middle">Python API</text>
    <rect x="685" y="140" width="160" height="46" rx="7" fill="#ffedd5" stroke="#c2410c"/><text x="765" y="168" class="actor" text-anchor="middle">Appointment service</text>
    <rect x="910" y="140" width="150" height="46" rx="7" fill="#f3e8ff" stroke="#7e22ce"/><text x="985" y="168" class="actor" text-anchor="middle">Mock provider</text>
    <rect x="1130" y="140" width="140" height="46" rx="7" fill="#f3e8ff" stroke="#7e22ce"/><text x="1200" y="168" class="actor" text-anchor="middle">SQL database</text>
    <g class="life"><line x1="140" y1="186" x2="140" y2="565"/><line x1="345" y1="186" x2="345" y2="565"/><line x1="550" y1="186" x2="550" y2="565"/><line x1="765" y1="186" x2="765" y2="565"/><line x1="985" y1="186" x2="985" y2="565"/><line x1="1200" y1="186" x2="1200" y2="565"/></g>
    <line x1="140" y1="220" x2="345" y2="220" class="call"/><text x="242" y="212" class="msg" text-anchor="middle">Request appointment</text>
    <line x1="345" y1="260" x2="550" y2="260" class="call"/><text x="447" y="252" class="msg" text-anchor="middle">Send request</text>
    <line x1="550" y1="300" x2="765" y2="300" class="call"/><text x="657" y="292" class="msg" text-anchor="middle">Search criteria</text>
    <line x1="765" y1="340" x2="985" y2="340" class="call"/><text x="875" y="332" class="msg" text-anchor="middle">Find available slots</text>
    <line x1="985" y1="380" x2="345" y2="380" class="return"/><text x="665" y="372" class="msg" text-anchor="middle">Return up to three options</text>
    <line x1="140" y1="420" x2="345" y2="420" class="call"/><text x="242" y="412" class="msg" text-anchor="middle">Select option</text>
    <line x1="345" y1="460" x2="140" y2="460" class="return"/><text x="242" y="452" class="msg" text-anchor="middle">Read back full details</text>
    <line x1="140" y1="500" x2="550" y2="500" class="call"/><text x="345" y="492" class="msg" text-anchor="middle">Explicit approval</text>
    <line x1="550" y1="535" x2="985" y2="535" class="call"/><text x="767" y="527" class="msg" text-anchor="middle">Create mock booking</text>
    <line x1="765" y1="560" x2="1200" y2="560" class="call"/><text x="982" y="552" class="msg" text-anchor="middle">Save confirmed appointment</text>
  </g>

  <rect x="30" y="625" width="660" height="645" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="55" y="662" class="panelTitle">2. Failed understanding and fallback</text>
  <g>
    <rect x="70" y="695" width="120" height="45" rx="7" fill="#e0f2fe" stroke="#0284c7"/><text x="130" y="723" class="actor" text-anchor="middle">User</text>
    <rect x="285" y="695" width="120" height="45" rx="7" fill="#ccfbf1" stroke="#0f766e"/><text x="345" y="723" class="actor" text-anchor="middle">React UI</text>
    <rect x="500" y="695" width="140" height="45" rx="7" fill="#ffedd5" stroke="#c2410c"/><text x="570" y="723" class="actor" text-anchor="middle">Interpreter</text>
    <g class="life"><line x1="130" y1="740" x2="130" y2="1215"/><line x1="345" y1="740" x2="345" y2="1215"/><line x1="570" y1="740" x2="570" y2="1215"/></g>
    <line x1="130" y1="785" x2="345" y2="785" class="call"/><text x="237" y="777" class="msg" text-anchor="middle">Speak or type request</text>
    <line x1="345" y1="835" x2="570" y2="835" class="call"/><text x="457" y="827" class="msg" text-anchor="middle">Interpret</text>
    <line x1="570" y1="885" x2="345" y2="885" class="return"/><text x="457" y="877" class="msg" text-anchor="middle">Low confidence</text>
    <line x1="345" y1="935" x2="130" y2="935" class="return"/><text x="237" y="927" class="msg" text-anchor="middle">Ask one clear question</text>
    <line x1="130" y1="985" x2="570" y2="985" class="call"/><text x="350" y="977" class="msg" text-anchor="middle">Retry with clarification</text>
    <rect x="95" y="1030" width="550" height="155" rx="8" fill="#ffffff" stroke="#c2410c" stroke-dasharray="7 5"/>
    <text x="115" y="1060" class="actor">If understood:</text><text x="220" y="1060" class="msg">continue the requested task.</text>
    <text x="115" y="1105" class="actor">If unresolved:</text><text x="225" y="1105" class="msg">offer typed choices, a trusted caregiver,</text>
    <text x="225" y="1130" class="msg">or human assistance. Never guess.</text>
  </g>

  <rect x="715" y="625" width="655" height="645" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
  <text x="740" y="662" class="panelTitle">3. Appointment reminder — later sprint</text>
  <g>
    <rect x="750" y="695" width="120" height="45" rx="7" fill="#ffedd5" stroke="#c2410c"/><text x="810" y="723" class="actor" text-anchor="middle">Scheduler</text>
    <rect x="910" y="695" width="120" height="45" rx="7" fill="#f3e8ff" stroke="#7e22ce"/><text x="970" y="723" class="actor" text-anchor="middle">Database</text>
    <rect x="1070" y="695" width="120" height="45" rx="7" fill="#ffedd5" stroke="#c2410c"/><text x="1130" y="723" class="actor" text-anchor="middle">Reminder</text>
    <rect x="1230" y="695" width="100" height="45" rx="7" fill="#e0f2fe" stroke="#0284c7"/><text x="1280" y="723" class="actor" text-anchor="middle">User</text>
    <g class="life"><line x1="810" y1="740" x2="810" y2="1215"/><line x1="970" y1="740" x2="970" y2="1215"/><line x1="1130" y1="740" x2="1130" y2="1215"/><line x1="1280" y1="740" x2="1280" y2="1215"/></g>
    <line x1="810" y1="790" x2="970" y2="790" class="call"/><text x="890" y="782" class="msg" text-anchor="middle">Find due reminders</text>
    <line x1="970" y1="850" x2="810" y2="850" class="return"/><text x="890" y="842" class="msg" text-anchor="middle">Due appointment</text>
    <line x1="810" y1="910" x2="1130" y2="910" class="call"/><text x="970" y="902" class="msg" text-anchor="middle">Deliver details</text>
    <line x1="1130" y1="970" x2="1280" y2="970" class="call"/><text x="1205" y="962" class="msg" text-anchor="middle">Display / speak</text>
    <line x1="1280" y1="1030" x2="1130" y2="1030" class="return"/><text x="1205" y="1022" class="msg" text-anchor="middle">Acknowledge</text>
    <line x1="1130" y1="1090" x2="970" y2="1090" class="call"/><text x="1050" y="1082" class="msg" text-anchor="middle">Save response</text>
    <text x="1040" y="1190" class="note" text-anchor="middle">Not required for Sprint 1</text>
  </g>
</svg>
