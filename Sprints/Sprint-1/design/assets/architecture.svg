<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CS160 Project high-level architecture</title>
  <desc id="desc">React and optional voice input communicate with a Python backend containing conversation, confirmation, appointment, and reminder services. The backend uses a SQL database, a mock healthcare provider, and future AI, speech, and real healthcare adapters.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .group { font-size: 18px; font-weight: 700; fill: #334155; }
      .boxTitle { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; fill: #475569; }
      .flow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .future { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="50" y="48" class="title">High-Level Architecture — Draft</text>

  <rect x="35" y="85" width="215" height="540" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="118" class="group">Users</text>
  <rect x="65" y="165" width="155" height="85" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="142" y="200" class="boxTitle" text-anchor="middle">Older adult</text>
  <text x="142" y="224" class="small" text-anchor="middle">or test user</text>
  <rect x="65" y="355" width="155" height="85" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="142" y="390" class="boxTitle" text-anchor="middle">Caregiver</text>
  <text x="142" y="414" class="small" text-anchor="middle">future scope</text>

  <rect x="285" y="85" width="230" height="540" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
  <text x="305" y="118" class="group">Client layer</text>
  <rect x="320" y="165" width="160" height="90" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="400" y="202" class="boxTitle" text-anchor="middle">React UI</text>
  <text x="400" y="226" class="small" text-anchor="middle">typed fallback</text>
  <rect x="320" y="355" width="160" height="90" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="400" y="390" class="boxTitle" text-anchor="middle">Voice I/O</text>
  <text x="400" y="414" class="small" text-anchor="middle">provider TBD</text>

  <rect x="550" y="85" width="355" height="540" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="570" y="118" class="group">Python backend</text>
  <rect x="640" y="145" width="175" height="62" rx="9" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="727" y="183" class="boxTitle" text-anchor="middle">HTTP API</text>
  <rect x="640" y="242" width="175" height="68" rx="9" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="727" y="271" class="boxTitle" text-anchor="middle">Conversation</text>
  <text x="727" y="294" class="small" text-anchor="middle">orchestrator</text>
  <rect x="580" y="355" width="135" height="70" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="647" y="385" class="boxTitle" text-anchor="middle">Confirmation</text>
  <text x="647" y="407" class="small" text-anchor="middle">service</text>
  <rect x="740" y="355" width="135" height="70" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="807" y="385" class="boxTitle" text-anchor="middle">Appointment</text>
  <text x="807" y="407" class="small" text-anchor="middle">service</text>
  <rect x="660" y="485" width="135" height="70" rx="9" fill="#fffaf5" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="727" y="515" class="boxTitle" text-anchor="middle">Reminder</text>
  <text x="727" y="537" class="small" text-anchor="middle">later sprint</text>

  <rect x="940" y="85" width="225" height="540" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
  <text x="960" y="118" class="group">Data &amp; adapters</text>
  <rect x="975" y="150" width="155" height="70" rx="9" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="1052" y="180" class="boxTitle" text-anchor="middle">SQL database</text>
  <text x="1052" y="202" class="small" text-anchor="middle">engine TBD</text>
  <rect x="975" y="270" width="155" height="70" rx="9" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="1052" y="300" class="boxTitle" text-anchor="middle">Mock provider</text>
  <text x="1052" y="322" class="small" text-anchor="middle">Sprint 1</text>
  <rect x="975" y="390" width="155" height="70" rx="9" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1052" y="420" class="boxTitle" text-anchor="middle">AI / speech</text>
  <text x="1052" y="442" class="small" text-anchor="middle">providers TBD</text>
  <rect x="975" y="510" width="155" height="70" rx="9" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1052" y="540" class="boxTitle" text-anchor="middle">Real healthcare</text>
  <text x="1052" y="562" class="small" text-anchor="middle">future scope</text>

  <path class="flow" d="M220 207 H320"/>
  <path class="flow future" d="M220 397 H320"/>
  <path class="flow" d="M480 210 H640"/>
  <path class="flow future" d="M400 355 V255"/>
  <path class="flow" d="M727 207 V242"/>
  <path class="flow" d="M690 310 L655 355"/>
  <path class="flow" d="M765 310 L800 355"/>
  <path class="flow future" d="M727 310 V485"/>
  <path class="flow" d="M875 390 H930 V305 H975"/>
  <path class="flow" d="M875 410 H920 V185 H975"/>
  <path class="flow future" d="M815 276 H920 V425 H975"/>
  <path class="flow future" d="M875 400 H945 V545 H975"/>

  <rect x="50" y="655" width="20" height="4" fill="#334155"/><text x="80" y="662" class="small">Sprint 1 path</text>
  <line x1="225" y1="657" x2="255" y2="657" stroke="#334155" stroke-width="3" stroke-dasharray="7 5"/><text x="265" y="662" class="small">TBD or later scope</text>
</svg>
