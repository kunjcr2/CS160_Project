<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Reported healthcare task difficulties</title>
  <desc id="desc">Horizontal bar chart of survey-reported difficulties: patient portals or healthcare apps 7, language barriers 5, remembering appointments 5, making or changing appointments 4, and remembering medications 4.</desc>
  <style>text { font-family: Arial, sans-serif; fill: #17324d; } .label { font-size: 20px; } .value { font-size: 18px; font-weight: 700; } .axis { font-size: 15px; fill: #5e7184; }</style>
  <rect width="900" height="390" fill="#f8fbfd"/>
  <text x="50" y="45" font-size="27" font-weight="700">Most frequently reported difficult tasks</text>
  <text x="50" y="72" class="axis">13 caregiver/supporter responses; respondents selected up to three tasks</text>
  <g stroke="#d5e0e8" stroke-width="1"><line x1="410" y1="100" x2="410" y2="345"/><line x1="475" y1="100" x2="475" y2="345"/><line x1="540" y1="100" x2="540" y2="345"/><line x1="605" y1="100" x2="605" y2="345"/><line x1="670" y1="100" x2="670" y2="345"/><line x1="735" y1="100" x2="735" y2="345"/><line x1="800" y1="100" x2="800" y2="345"/></g>
  <g class="axis"><text x="406" y="367">0</text><text x="471" y="367">1</text><text x="536" y="367">2</text><text x="601" y="367">3</text><text x="666" y="367">4</text><text x="731" y="367">5</text><text x="796" y="367">6</text><text x="861" y="367">7</text></g>
  <g class="label"><text x="50" y="128">Patient portals / healthcare apps</text><text x="50" y="173">Language barriers</text><text x="50" y="218">Remembering appointments</text><text x="50" y="263">Making or changing appointments</text><text x="50" y="308">Remembering medications</text></g>
  <g fill="#4a8c5a"><rect x="410" y="106" width="455" height="28" rx="4"/><rect x="410" y="151" width="325" height="28" rx="4"/><rect x="410" y="196" width="325" height="28" rx="4"/><rect x="410" y="241" width="260" height="28" rx="4"/><rect x="410" y="286" width="260" height="28" rx="4"/></g>
  <g class="value"><text x="875" y="128">7</text><text x="745" y="173">5</text><text x="745" y="218">5</text><text x="680" y="263">4</text><text x="680" y="308">4</text></g>
</svg>
